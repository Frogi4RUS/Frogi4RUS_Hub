<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogi4RUS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }

  html, body { height:100%; }

  body {
    background:#061318;
    color:#fff;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
  }

  /* ============ ФОН ============ */

  /* Глубокий градиент */
  .bg-base {
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 80% 60% at 15% 10%, rgba(0,255,200,.28) 0%, transparent 55%),
      radial-gradient(ellipse 70% 60% at 85% 20%, rgba(0,224,255,.22) 0%, transparent 55%),
      radial-gradient(ellipse 80% 70% at 75% 90%, rgba(168,85,247,.28) 0%, transparent 55%),
      radial-gradient(ellipse 70% 60% at 20% 85%, rgba(132,204,22,.22) 0%, transparent 55%),
      radial-gradient(ellipse 60% 50% at 50% 50%, rgba(0,255,180,.1) 0%, transparent 70%),
      linear-gradient(180deg, #061318 0%, #0a1a22 50%, #061318 100%);
    animation:baseShift 30s ease-in-out infinite;
  }

  @keyframes baseShift {
    0%, 100% { filter:hue-rotate(0deg); }
    50% { filter:hue-rotate(25deg); }
  }

  /* Плавающие светящиеся сферы */
  .orb {
    position:fixed;
    border-radius:50%;
    filter:blur(100px);
    pointer-events:none;
    z-index:1;
    mix-blend-mode:screen;
    will-change:transform;
  }
  .orb-1 {
    width:520px; height:520px;
    background:radial-gradient(circle, #00ffc8 0%, #00b890 70%);
    top:-180px; left:-140px;
    opacity:.5;
    animation:float1 22s ease-in-out infinite;
  }
  .orb-2 {
    width:460px; height:460px;
    background:radial-gradient(circle, #22d3ee 0%, #0891b2 70%);
    top:40%; right:-160px;
    opacity:.42;
    animation:float2 26s ease-in-out infinite;
  }
  .orb-3 {
    width:480px; height:480px;
    background:radial-gradient(circle, #a855f7 0%, #7c3aed 70%);
    bottom:-180px; left:25%;
    opacity:.4;
    animation:float3 30s ease-in-out infinite;
  }
  .orb-4 {
    width:400px; height:400px;
    background:radial-gradient(circle, #a3e635 0%, #65a30d 70%);
    top:15%; left:50%;
    opacity:.35;
    animation:float2 34s ease-in-out infinite reverse;
  }
  .orb-5 {
    width:340px; height:340px;
    background:radial-gradient(circle, #00ffe0 0%, #06b6d4 70%);
    bottom:10%; right:15%;
    opacity:.3;
    animation:float1 28s ease-in-out infinite reverse;
  }

  @keyframes float1 {
    0%, 100% { transform:translate(0,0) scale(1); }
    50% { transform:translate(180px,120px) scale(1.15); }
  }
  @keyframes float2 {
    0%, 100% { transform:translate(0,0) scale(1); }
    50% { transform:translate(-160px,-100px) scale(1.2); }
  }
  @keyframes float3 {
    0%, 100% { transform:translate(0,0) scale(1); }
    50% { transform:translate(120px,-140px) scale(1.12); }
  }

  /* Тонкая сетка поверх */
  body::before {
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(120,255,220,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,255,220,.035) 1px, transparent 1px);
    background-size:55px 55px;
    z-index:1;
    pointer-events:none;
    mask-image:radial-gradient(circle at center, black 25%, transparent 85%);
    -webkit-mask-image:radial-gradient(circle at center, black 25%, transparent 85%);
  }

  /* Мягкое затемнение по краям (виньетка) */
  body::after {
    content:'';
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.5) 100%);
    z-index:1;
    pointer-events:none;
  }

  /* ============ КАРТОЧКА ============ */

  .scene {
    position:relative;
    z-index:2;
    width:100%;
    max-width:420px;
    perspective:1000px;
  }

  .card {
    position:relative;
    background:
      linear-gradient(160deg, rgba(22,45,52,.75) 0%, rgba(10,22,30,.9) 100%);
    border:1px solid rgba(100,255,220,.14);
    border-radius:30px;
    padding:40px 26px 32px;
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    box-shadow:
      0 50px 100px -30px rgba(0,0,0,.9),
      0 0 100px -30px rgba(0,255,200,.35),
      inset 0 1px 0 rgba(150,255,230,.12),
      inset 0 -1px 0 rgba(168,85,247,.08);
    animation:cardEnter 1.1s cubic-bezier(.16,1,.3,1);
    transition:transform .6s cubic-bezier(.16,1,.3,1);
  }

  .card:hover {
    transform:translateY(-4px);
  }

  @keyframes cardEnter {
    from { opacity:0; transform:translateY(60px) rotateX(18deg) scale(.94); }
    to { opacity:1; transform:translateY(0) rotateX(0) scale(1); }
  }

  /* Градиентная рамка (бирюза → салат → фиолет) */
  .card::after {
    content:'';
    position:absolute;
    inset:0;
    border-radius:30px;
    padding:1.5px;
    background:linear-gradient(135deg,
      rgba(0,255,200,.7) 0%,
      rgba(0,224,255,.5) 25%,
      rgba(163,230,53,.5) 50%,
      rgba(168,85,247,.5) 75%,
      rgba(0,255,200,.6) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
    animation:borderShift 8s ease-in-out infinite;
    background-size:300% 300%;
  }

  @keyframes borderShift {
    0%, 100% { background-position:0% 50%; }
    50% { background-position:100% 50%; }
  }

  /* Светящаяся полоска сверху */
  .card::before {
    content:'';
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:60%;
    height:2px;
    background:linear-gradient(90deg, transparent, #00ffc8, #a3e635, #a855f7, transparent);
    border-radius:2px;
    animation:topShimmer 4s ease-in-out infinite;
    background-size:200% 100%;
  }

  @keyframes topShimmer {
    0%, 100% { opacity:.6; width:45%; background-position:0% 0; }
    50% { opacity:1; width:75%; background-position:100% 0; }
  }

  /* ============ HEADER ============ */

  .header {
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-bottom:26px;
    border-bottom:1px solid rgba(100,255,220,.12);
    margin-bottom:26px;
    gap:16px;
  }

  .avatar {
    position:relative;
    width:100px;
    height:100px;
    flex-shrink:0;
  }

  /* Вращающееся градиентное кольцо */
  .avatar::before {
    content:'';
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background:conic-gradient(from 0deg,
      #00ffc8, #22d3ee, #a3e635, #a855f7, #00ffc8);
    animation:spin 6s linear infinite;
    z-index:0;
  }

  /* Тёмное кольцо-разделитель */
  .avatar::after {
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    background:#0a1a22;
    z-index:1;
  }

  @keyframes spin { to { transform:rotate(360deg); } }

  .avatar img {
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    z-index:2;
    transition:transform .5s cubic-bezier(.16,1,.3,1);
  }

  .avatar:hover img { transform:scale(1.06); }

  /* Внешнее свечение аватарки */
  .avatar-glow {
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(0,255,200,.4) 0%, transparent 70%);
    z-index:-1;
    animation:glowPulse 3s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity:.5; transform:scale(1); }
    50% { opacity:.85; transform:scale(1.1); }
  }

  /* ============ НИК С ЦВЕТНЫМ СВЕЧЕНИЕМ ============ */

  .name {
    font-size:26px;
    font-weight:800;
    letter-spacing:.5px;
    position:relative;
    display:inline-block;
    /* Переливающийся градиент бирюза → салат → фиолет */
    background:linear-gradient(90deg,
      #00ffc8 0%,
      #22d3ee 20%,
      #a3e635 45%,
      #a855f7 75%,
      #00ffc8 100%);
    background-size:250% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    animation:nameFlow 6s linear infinite;
  }

  /* Светящийся «дубль» позади — создаёт эффект свечения */
  .name::before {
    content:'Frogi4RUS';
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,
      #00ffc8 0%,
      #22d3ee 20%,
      #a3e635 45%,
      #a855f7 75%,
      #00ffc8 100%);
    background-size:250% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    filter:blur(14px);
    opacity:.85;
    animation:nameFlow 6s linear infinite;
    z-index:-1;
  }

  @keyframes nameFlow {
    to { background-position:250% center; }
  }

  .tagline {
    font-size:14px;
    color:rgba(150,255,230,.7);
    font-weight:500;
    letter-spacing:.4px;
    line-height:1.4;
    position:relative;
  }

  .tagline::before,
  .tagline::after {
    content:'';
    display:inline-block;
    width:22px;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(0,255,200,.5), transparent);
    vertical-align:middle;
    margin:0 10px;
  }

  /* ============ ССЫЛКИ ============ */

  .links {
    display:flex;
    flex-direction:column;
    gap:11px;
  }

  .link-btn {
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    border-radius:18px;
    text-decoration:none;
    color:#fff;
    font-size:15px;
    font-weight:600;
    background:linear-gradient(135deg, rgba(0,255,200,.05), rgba(168,85,247,.03));
    border:1px solid rgba(100,255,220,.12);
    overflow:hidden;
    cursor:pointer;
    transition:transform .35s cubic-bezier(.16,1,.3,1),
                background .35s,
                border-color .35s,
                box-shadow .35s;
    opacity:0;
    animation:btnEnter .7s cubic-bezier(.16,1,.3,1) forwards;
  }
  .link-btn:nth-child(1) { animation-delay:.5s; }
  .link-btn:nth-child(2) { animation-delay:.65s; }
  .link-btn:nth-child(3) { animation-delay:.8s; }

  @keyframes btnEnter {
    from { opacity:0; transform:translateX(-30px); }
    to { opacity:1; transform:translateX(0); }
  }

  /* Пробегающий блик */
  .link-btn::after {
    content:'';
    position:absolute;
    top:0; left:-150%;
    width:80%;
    height:100%;
    background:linear-gradient(90deg,
      transparent,
      rgba(255,255,255,.12),
      transparent);
    transform:skewX(-20deg);
    transition:none;
    pointer-events:none;
  }

  .link-btn:hover::after {
    animation:shine 1s ease-out;
  }

  @keyframes shine {
    to { left:150%; }
  }

  .link-btn .icon-box {
    width:40px;
    height:40px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
    transition:transform .45s cubic-bezier(.34,1.56,.64,1);
    color:#fff;
  }

  .link-btn .label { flex:1; text-align:left; letter-spacing:.3px; }

  .link-btn .chev {
    font-size:12px;
    opacity:.4;
    transition:all .35s;
  }

  /* Полупрозрачный слой подсветки при hover */
  .link-btn::before {
    content:'';
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity .4s;
    z-index:0;
    border-radius:inherit;
  }

  .link-btn > * { position:relative; z-index:1; }

  .link-btn:hover {
    transform:translateY(-4px);
    border-color:rgba(100,255,220,.35);
    box-shadow:
      0 15px 35px -10px rgba(0,0,0,.6),
      0 0 30px -8px rgba(0,255,200,.35);
  }

  .link-btn:hover::before { opacity:1; }
  .link-btn:hover .icon-box {
    transform:scale(1.12) rotate(-6deg);
  }
  .link-btn:hover .chev {
    opacity:1;
    transform:translateX(4px);
    color:#00ffc8;
  }
  .link-btn:active { transform:translateY(-2px) scale(.98); }

  /* ============ ЛОГОТИПЫ СОЦСЕТЕЙ ============ */
  /* Telegram — фирменный голубой */
  .telegram .icon-box {
    background:linear-gradient(135deg,#2AABEE,#229ED9);
    box-shadow:0 8px 20px -4px rgba(34,158,217,.5);
  }
  .telegram::before {
    background:linear-gradient(90deg, rgba(42,171,238,.18), transparent 70%);
  }

  /* YouTube — фирменный красный */
  .youtube .icon-box {
    background:linear-gradient(135deg,#FF0000,#c4302b);
    box-shadow:0 8px 20px -4px rgba(255,0,0,.5);
  }
  .youtube::before {
    background:linear-gradient(90deg, rgba(255,0,0,.18), transparent 70%);
  }

  /* TikTok — фирменный чёрный с бирюзово-розовыми полосами */
  .tiktok .icon-box {
    background:#000;
    box-shadow:0 8px 20px -4px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.12);
    position:relative;
    overflow:hidden;
  }
  .tiktok .icon-box::before {
    content:'';
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(37,244,238,.55) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(254,44,85,.55) 0%, transparent 50%);
    pointer-events:none;
  }
  .tiktok .icon-box i {
    color:#fff;
    position:relative;
    z-index:1;
    text-shadow:
      -1px -1px 0 rgba(37,244,238,.95),
      1px 1px 0 rgba(254,44,85,.95);
  }
  .tiktok::before {
    background:linear-gradient(90deg, rgba(37,244,238,.15), rgba(254,44,85,.15) 60%, transparent);
  }

  /* ============ АДАПТИВ ============ */
  @media (max-width:480px) {
    .card { padding:32px 20px 26px; border-radius:26px; }
    .avatar { width:88px; height:88px; }
    .name { font-size:22px; }
    .tagline { font-size:13px; }
    .tagline::before, .tagline::after { width:14px; margin:0 8px; }
    .link-btn { padding:14px 15px; gap:12px; border-radius:16px; }
    .link-btn .icon-box { width:38px; height:38px; font-size:19px; }
  }
</style>
</head>
<body>

<!-- Фоновые слои -->
<div class="bg-base"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="orb orb-4"></div>
<div class="orb orb-5"></div>

<div class="scene">
  <div class="card">

    <div class="header">
      <div class="avatar">
        <div class="avatar-glow"></div>
        <img src="https://i.postimg.cc/BQLs8yVJ/20250715-062935.jpg" alt="Frogi4RUS">
      </div>
      <div class="name">Frogi4RUS</div>
      <div class="tagline">Здесь собраны все мои соцсети</div>
    </div>

    <div class="links">

      <a href="https://t.me/Frogi4RUS_tg" target="_blank" class="link-btn telegram">
        <div class="icon-box"><i class="fab fa-telegram"></i></div>
        <div class="label">Telegram</div>
        <i class="fas fa-chevron-right chev"></i>
      </a>

      <a href="https://youtube.com/@frogi4rus" target="_blank" class="link-btn youtube">
        <div class="icon-box"><i class="fab fa-youtube"></i></div>
        <div class="label">YouTube</div>
        <i class="fas fa-chevron-right chev"></i>
      </a>

      <a href="https://www.tiktok.com/@frogi4rus" target="_blank" class="link-btn tiktok">
        <div class="icon-box"><i class="fab fa-tiktok"></i></div>
        <div class="label">TikTok</div>
        <i class="fas fa-chevron-right chev"></i>
      </a>

    </div>

  </div>
</div>

<script>
/* =====================================================
   ОЗВУЧКА GOOGLE — «Здесь собраны все мои соцсети»
   ===================================================== */
function speakGreeting() {
  if (!('speechSynthesis' in window)) return;

  const text = 'Здесь собраны все мои соцсети';

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ru-RU';
  utter.rate = 0.8;
  utter.pitch = 0.95;
  utter.volume = 1;

  const voices = speechSynthesis.getVoices();
  let ruVoice = voices.find(v => v.lang === 'ru-RU' && /google/i.test(v.name))
             || voices.find(v => v.lang === 'ru-RU')
             || voices.find(v => v.lang.startsWith('ru'));

  if (ruVoice) utter.voice = ruVoice;

  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

let spoken = false;
function onFirstGesture() {
  if (spoken) return;
  spoken = true;
  setTimeout(speakGreeting, 300);
  ['pointerdown','touchend','click','keydown'].forEach(ev => {
    document.removeEventListener(ev, onFirstGesture, true);
  });
}

['pointerdown','touchend','click','keydown'].forEach(ev => {
  document.addEventListener(ev, onFirstGesture, true);
});
</script>

</body>
</html>
